<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — Guía Colbún</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }
    header {
      background: #1e3a5f;
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
    header a  { color: #93c5fd; font-size: 13px; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    .toolbar {
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1; min-width: 220px; max-width: 360px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: #1e293b;
      outline: none;
    }
    .search-input:focus { border-color: #1e3a5f; }

    .filter-select {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
      color: #1e293b;
      outline: none;
      cursor: pointer;
    }

    .stats {
      margin-left: auto;
      font-size: 12px;
      color: #64748b;
      white-space: nowrap;
    }

    .table-wrap {
      padding: 0 28px 40px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      font-size: 13px;
    }
    thead tr { background: #1e3a5f; color: #fff; }
    th { padding: 12px 14px; font-weight: 600; text-align: left; white-space: nowrap; }
    td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .badge-pantalla {
      display: inline-block;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-area {
      display: inline-block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .comentario-cell { max-width: 400px; line-height: 1.5; color: #334155; }
    .date-cell { color: #64748b; white-space: nowrap; font-size: 11.5px; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      font-size: 14px;
    }
    .btn-refresh {
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-refresh:hover { background: #1e40af; }
  </style>
</head>
<body>

<header>
  <h1>💬 Feedback de la Guía de Procedimientos</h1>
  <a href="/">← Volver a la herramienta</a>
</header>

<div class="toolbar">
  <input type="text" id="search" class="search-input" placeholder="Buscar en comentarios o pantalla…" />
  <select id="filter-pantalla" class="filter-select">
    <option value="">Todas las pantallas</option>
  </select>
  <button class="btn-refresh" onclick="loadFeedback()">↻ Actualizar</button>
  <span class="stats" id="stats"></span>
</div>

<div class="table-wrap">
  <table id="fb-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Fecha</th>
        <th>Ubicación en la herramienta</th>
        <th>Área / PRO</th>
        <th>Comentario</th>
      </tr>
    </thead>
    <tbody id="fb-body">
      <tr><td colspan="5" class="empty">Cargando…</td></tr>
    </tbody>
  </table>
</div>

<script>
let allData = [];

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es-CL", {day:"2-digit", month:"2-digit", year:"numeric"})
    + " " + d.toLocaleTimeString("es-CL", {hour:"2-digit", minute:"2-digit"});
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(data) {
  const tbody = document.getElementById("fb-body");
  document.getElementById("stats").textContent = `${data.length} comentario${data.length !== 1 ? "s" : ""}`;
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">No hay comentarios aún.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map((r, i) => `
    <tr>
      <td style="color:#94a3b8;font-size:11px">${data.length - i}</td>
      <td class="date-cell">${esc(fmt(r.created_at))}</td>
      <td><span class="badge-pantalla" title="${esc(r.pantalla)}">${esc(r.pantalla)}</span></td>
      <td>${r.area_id ? `<span class="badge-area">${esc(r.area_id)}${r.pro_id ? " · " + esc(r.pro_id) : ""}</span>` : '<span style="color:#94a3b8;font-size:11px">—</span>'}</td>
      <td class="comentario-cell">${esc(r.comentario)}</td>
    </tr>`).join("");
}

function applyFilters() {
  const q   = document.getElementById("search").value.toLowerCase();
  const pant = document.getElementById("filter-pantalla").value;
  const filtered = allData.filter(r => {
    const matchQ    = !q || r.comentario.toLowerCase().includes(q) || r.pantalla.toLowerCase().includes(q);
    const matchPant = !pant || r.pantalla === pant;
    return matchQ && matchPant;
  });
  render(filtered);
}

async function loadFeedback() {
  try {
    const res = await fetch("/api/feedback");
    allData = await res.json();

    // Populate pantalla filter
    const pantallas = [...new Set(allData.map(r => r.pantalla))].sort();
    const sel = document.getElementById("filter-pantalla");
    const prev = sel.value;
    sel.innerHTML = `<option value="">Todas las pantallas</option>` +
      pantallas.map(p => `<option value="${esc(p)}"${p === prev ? " selected" : ""}>${esc(p)}</option>`).join("");

    applyFilters();
  } catch(e) {
    document.getElementById("fb-body").innerHTML =
      `<tr><td colspan="5" class="empty">Error al cargar: ${e.message}</td></tr>`;
  }
}

document.getElementById("search").addEventListener("input", applyFilters);
document.getElementById("filter-pantalla").addEventListener("change", applyFilters);

loadFeedback();
</script>
</body>
</html>
